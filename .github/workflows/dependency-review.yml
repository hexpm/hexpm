name: Dependency Review

# pull_request_target is needed to get write permission for posting PR
# comments on fork PRs; no code from the PR is executed. Only the Mix files
# and the workflows (for the actions they use) declare dependencies.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    paths:
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  review:
    name: Review Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          comment-summary-in-pr: always
          retry-on-snapshot-warnings: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
